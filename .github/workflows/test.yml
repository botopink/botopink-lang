# Push/PR CI for botopink-lang — the same gate as the local one
# (scripts/gate.sh), minus the staged-file checks.
#
#   test  `zig fmt --check modules` (the gate's stage 1, whole tree), `zig
#         build test` from a cold runtime cache, `zig build test-bpmp`,
#         `scripts/beam_export_audit.sh`, then `zig build test-cli` (the CLI
#         command contract, test tooling, mutual recursion and backend
#         execution parity scripts), `scripts/format-check.sh` (decision 66:
#         `botopink format --check` over the compiler's canonical `.bp` trees),
#         then `zig build test-language` (tests/language) and `zig build
#         test-docs` (every `botopink` fence of the user docs compiles, every
#         `reject` fence is refused). Every row runs every step and every row
#         is hard: ubuntu + macos. There is no windows row (1.0.11-beta
#         00-gate, gate-f): the snapshot capture carries CRLF / path-separator
#         drift there, and a row that cannot fail measures nothing — the gap
#         is listed in the milestone's status.md and the row returns hard, or
#         not at all.
#         Build mode as the gate's (decision 226): `zig build test` stays
#         Debug, and every `zig build` step after it passes
#         `-Doptimize=ReleaseSafe` — the mode `scripts/gate.sh` passes as
#         `$opt` and `release.yml` ships — so no step reinstalls a Debug
#         `botopink` over the one the others run. `test-web` is the gate's
#         stage 12 (decision 231) and keeps the default mode, as the gate runs it.
#   libs  every sibling library checked out next to botopink-lang
#         (emilia, erika, jhonstart, onze, rakun at `feat`) plus libs/std,
#         compiled and tested on every runnable target by `zig build test-libs
#         -Doptimize=ReleaseSafe` (a library without tests is still compiled).
#         The manifest decides the matrix: a member runs on the targets its
#         botopink.json declares and on no other, and a cell that exists is
#         green or the job fails, by name, with its diagnostic in the log —
#         no file lists a red cell away or pins a failed count. A target a
#         member's "targets" list excludes is not a cell, and the exclusion
#         is audited on every run: `botopink build --target <excluded>` must
#         be refused for a missing host binding, or the job fails naming the
#         member and the target (scripts/AGENTS.md § test-libs.sh).
name: test

on:
  push:
    branches: [main, feat]
  pull_request:
    branches: [main, feat]

# Cancel a prior run for the same ref so a force-push doesn't pile builds up.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: zig build test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install Zig (pinned to build.zig.zon minimum_zig_version)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # 60 tests under `comptime/runtime/erlang.zig` shell out to `erl`/`erlc`
      # via `std.process.run`. Install Erlang/OTP 27+ — the comptime runtime
      # writes JSON via `json:encode/1`, which only landed in OTP 27.
      # `erlef/setup-beam` pins the version on linux; macos installs Homebrew's
      # `erlang@<release>` (decision 227 — the plain `erlang` bottle is the
      # latest OTP, 29 at the time), and the step after both asserts it. The
      # release is the compiler's (decision 228, the step before). `zig build`
      # itself runs `erlc` (front 18, decision 83 — the resident comptime
      # modules are compiled at build time and embedded), so every row needs
      # OTP before the build.
      # Decision 228: the release is the compiler's `OTP_RELEASE`
      # (modules/manifest/src/root.zig, printed by `botopink --version`), read
      # from the source because the compiler is not built yet; every erlang and
      # beam run of the compiler refuses another `erl` on PATH.
      - name: Read the Erlang/OTP release the compiler emits for
        id: otp
        shell: bash
        run: |
          release="$(sed -n 's/^pub const OTP_RELEASE = "\([0-9][0-9]*\)";$/\1/p' modules/manifest/src/root.zig)"
          [ -n "$release" ] || { echo "modules/manifest/src/root.zig declares no OTP_RELEASE (decision 228)"; exit 1; }
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Install Erlang/OTP (linux)
        if: matrix.runner == 'ubuntu-22.04'
        uses: erlef/setup-beam@v1
        with:
          # OTP 28 (BEAM 16.x) today. OTP 27 (BEAM 15.x) treats the
          # `ambiguous call of overridden BIF abs/1` diagnostic in the codegen
          # `if_with_else_branch` fixture as a compile *error*; OTP 28 treats
          # it as a warning, which is what the runtime expects (erlc must exit
          # 0 for the test framework's snapshot RUN LOG capture to fire).
          otp-version: ${{ steps.otp.outputs.release }}

      - name: Install Erlang/OTP (macos)
        if: matrix.runner == 'macos-14'
        env:
          OTP: ${{ steps.otp.outputs.release }}
        run: |
          brew install "erlang@$OTP" && brew link --force "erlang@$OTP"
          echo "$(brew --prefix "erlang@$OTP")/bin" >> "$GITHUB_PATH"

      # Decisions 227 and 228: the compiler's release on every row, linux and
      # macos alike — `erlang@<release>` is keg-only, so its `bin` goes on PATH
      # above; any other release here fails the job rather than testing against it.
      - name: Assert Erlang/OTP
        shell: bash
        env:
          OTP: ${{ steps.otp.outputs.release }}
        run: |
          otp="$(erl -noshell -eval 'io:format("~s",[erlang:system_info(otp_release)]),halt().')"
          [ "$otp" = "$OTP" ] || { echo "Erlang/OTP is '$otp', not $OTP (decisions 227, 228)"; exit 1; }

      # 26 wasm-codegen snapshot tests embed the wasmtime `RUN LOG`
      # (stdout of the generated `.wat` evaluated against wasmtime) into
      # the snapshot itself. Without wasmtime on PATH the run log is
      # empty and every wasm snapshot mismatches.
      #
      # We pin a specific release tarball instead of running the
      # `wasmtime.dev/install.sh` shell installer — that script's
      # version lookup is flaky on the GH runners (resolves to literal
      # `{` on macOS, to `<!DOCTYPE html>` on linux when the upstream
      # release feed 404s under rate-limiting).
      - name: Install wasmtime (linux)
        if: matrix.runner == 'ubuntu-22.04'
        shell: bash
        env:
          WASMTIME_VERSION: v45.0.1
        run: |
          set -euo pipefail
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/wasmtime.tar.xz "$url"
          mkdir -p "$HOME/.wasmtime/bin"
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp/
          mv "/tmp/wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$HOME/.wasmtime/bin/"
          chmod +x "$HOME/.wasmtime/bin/wasmtime"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          "$HOME/.wasmtime/bin/wasmtime" --version

      - name: Install wasmtime (macos)
        if: matrix.runner == 'macos-14'
        run: brew install wasmtime

      # First step prints the resolved Zig version + SHA so a CI red can be
      # bisected against a Zig point release without re-running the job.
      - name: Print build identity
        shell: bash
        run: |
          echo "zig version: $(zig version)"
          echo "git sha: $GITHUB_SHA"
          echo "runner: ${{ matrix.runner }}"

      - name: Install Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # The gate's stage 1, whole tree: a `.zig` file `zig fmt` would rewrite
      # fails the job and is listed. Needs only zig.
      - name: zig fmt --check modules
        shell: bash
        run: zig fmt --check modules

      # The merge-deciding run is cold: a stale runtime-cache entry can hide a
      # backend that never ran. A fresh checkout has no cache; the delete makes
      # that explicit should a cache action ever be added.
      - name: zig build test (cold runtime cache)
        shell: bash
        run: |
          rm -rf modules/compiler-core/.botopinkbuild/runtime-cache
          zig build test

      # Front 18 step 4: every snapshot is recorded under both comptime
      # runtimes, and the pairs are equal but for their listing sections.
      - name: comptime runtime parity
        shell: bash
        run: bash scripts/snap_audit.sh --mode=runtime-parity

      - name: zig build test-bpmp (ReleaseSafe)
        shell: bash
        run: zig build test-bpmp -Doptimize=ReleaseSafe

      # Every beam snapshot module assembled with every function exported: a
      # rejected module prints `REJECTED <slug> <module>` with the validator's
      # function, offset and reason. Needs erlc.
      - name: beam export audit
        shell: bash
        run: bash scripts/beam_export_audit.sh

      - name: zig build test-cli (ReleaseSafe)
        shell: bash
        run: zig build test-cli -Doptimize=ReleaseSafe

      # Decision 66: `botopink format --check` over the compiler's own `.bp`
      # trees, every one canonical — the list is `TREES` in
      # scripts/format-check.sh. Needs only the CLI, installed by test-cli.
      - name: botopink format --check
        shell: bash
        run: bash scripts/format-check.sh

      # Decision 8's language tests on commonJS and erlang; a red cell
      # fails the job — the suite keeps no list of known failures.
      # Needs node and erl.
      - name: zig build test-language (ReleaseSafe)
        shell: bash
        run: zig build test-language -Doptimize=ReleaseSafe

      # Every `botopink` fence in docs.md and README.md compiles and every
      # `reject` fence is refused (scripts/check-docs.sh). docs.md's
      # library-dependency example declares `erika`, which the harness
      # resolves by name under `repository/` — the same place the libs job
      # puts the sibling libraries — so erika is checked out there first.
      - name: Checkout erika (docs.md's library-dependency fence)
        uses: actions/checkout@v5
        with: { repository: botopink/erika, ref: feat, path: repository/erika }

      - name: zig build test-docs (ReleaseSafe)
        shell: bash
        run: zig build test-docs -Doptimize=ReleaseSafe

      # Every `.d.ts` the commonJS backend emits for libs/ (std and the
      # bundled packages), the example projects (erika, checked out above, is
      # generic-loader-binding's dependency) and the tests/language/modules
      # cells passes `tsc --noEmit --strict`
      # (scripts/tsc-check.sh; typescript pinned, through npx).
      - name: tsc --noEmit over the emitted .d.ts, node --check over the emitted .js
        shell: bash
        run: bash scripts/tsc-check.sh

      # The browser build (front 18 step 5): compiler-core for wasm32-wasi,
      # then modules/compiler-web/tests/smoke.js under node — one program to
      # the four targets, a rendered diagnostic, the comptime refusal.
      - name: zig build test-web
        shell: bash
        run: zig build test-web

  libs:
    name: zig build test-libs (sibling libraries, all runnable targets)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout botopink-lang
        uses: actions/checkout@v5

      # `botopink-lib-test` discovers `<root>/libs` (std) and every project
      # under `<root>/repository/`, and `botopink` resolves a library's own
      # dependencies through the same roots.
      - name: Checkout emilia
        uses: actions/checkout@v5
        with: { repository: botopink/emilia, ref: feat, path: repository/emilia }
      - name: Checkout erika
        uses: actions/checkout@v5
        with: { repository: botopink/erika, ref: feat, path: repository/erika }
      - name: Checkout jhonstart
        uses: actions/checkout@v5
        with: { repository: botopink/jhonstart, ref: feat, path: repository/jhonstart }
      - name: Checkout onze
        uses: actions/checkout@v5
        with: { repository: botopink/onze, ref: feat, path: repository/onze }
      - name: Checkout rakun
        uses: actions/checkout@v5
        with: { repository: botopink/rakun, ref: feat, path: repository/rakun }

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Decision 228: the release is the compiler's `OTP_RELEASE`
      # (modules/manifest/src/root.zig, printed by `botopink --version`), read
      # from the source because the compiler is not built yet; every erlang and
      # beam run of the compiler refuses another `erl` on PATH.
      - name: Read the Erlang/OTP release the compiler emits for
        id: otp
        shell: bash
        run: |
          release="$(sed -n 's/^pub const OTP_RELEASE = "\([0-9][0-9]*\)";$/\1/p' modules/manifest/src/root.zig)"
          [ -n "$release" ] || { echo "modules/manifest/src/root.zig declares no OTP_RELEASE (decision 228)"; exit 1; }
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.otp.outputs.release }}

      - name: Assert Erlang/OTP
        shell: bash
        env:
          OTP: ${{ steps.otp.outputs.release }}
        run: |
          otp="$(erl -noshell -eval 'io:format("~s",[erlang:system_info(otp_release)]),halt().')"
          [ "$otp" = "$OTP" ] || { echo "Erlang/OTP is '$otp', not $OTP (decisions 227, 228)"; exit 1; }

      - name: Print library identity
        shell: bash
        run: |
          for r in repository/*/; do
            echo "$(basename "$r"): $(git -C "$r" rev-parse HEAD)"
          done

      - name: zig build test-libs (ReleaseSafe)
        shell: bash
        run: zig build test-libs -Doptimize=ReleaseSafe
