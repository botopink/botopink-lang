# Push/PR CI for botopink-lang — `scripts/gate.sh`, the repository's one gate
# (decisions 466, 470, 477): the same command the commit hook runs with
# `--no-conformance`, here WITH conformance and `--cold`, so a push to `feat`
# runs every stage the gate declares — `zig fmt`, the build, the backend
# partition audit, the unit suites, test-bpmp, the beam export audit, test-cli, test-libs over
# the sibling libraries checked out under `repository/`, the conformance suite
# (`conformance/`, every cell on every target it declares), test-docs (every
# reference of `conformance/docs.md` names a cell), tsc-check and test-web.
# The workflow keeps no list of stages of its own: a stage is added to or
# removed from `scripts/gate.sh`, and CI runs it. A front's Conformance step
# reads this run (decision 477).
#
#   test  one job, hard: ubuntu-22.04 (no macos row). There is no
#         windows row (1.0.11-beta 00-gate, gate-f): the snapshot capture
#         carries CRLF / path-separator drift there, and a row that cannot
#         fail measures nothing. The steps before the gate install what it
#         runs: zig, the compiler's Erlang/OTP release (decisions 227, 228),
#         wasmtime, node 22 and the sibling libraries test-libs compiles and
#         tests on every runnable target (`scripts/AGENTS.md` § test-libs.sh).

name: test

on:
  push:
    branches: [main, feat]
  pull_request:
    branches: [main, feat]

# A started run finishes (the maintainer, 2026-10-13): with two machines pushing to feat, cancelling the running
# one left no run finished; GitHub keeps one running and one pending per ref, the newest pending replacing the older.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: scripts/gate.sh (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Install Zig (pinned to build.zig.zon minimum_zig_version)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The erlang and beam targets' tests run `erl` / `erlc` (the RUN LOGs, the
      # beam export audit, `botopink run|test --target erlang|beam`); compiling
      # needs neither — comptime runs on wasm (decision 434). `erlef/setup-beam`
      # pins the version (decision 227), and the step after asserts it. The release is the
      # compiler's (decision 228, the step before).
      # Decision 228: the release is the compiler's `OTP_RELEASE`
      # (modules/manifest/src/root.zig, printed by `botopink --version`), read
      # from the source because the compiler is not built yet; every erlang and
      # beam run of the compiler refuses another `erl` on PATH.
      - name: Read the Erlang/OTP release the compiler emits for
        id: otp
        shell: bash
        run: |
          release="$(sed -n 's/^pub const OTP_RELEASE = "\([0-9][0-9]*\)";$/\1/p' modules/manifest/src/root.zig)"
          [ -n "$release" ] || { echo "modules/manifest/src/root.zig declares no OTP_RELEASE (decision 228)"; exit 1; }
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          # OTP 28 (BEAM 16.x) today. OTP 27 (BEAM 15.x) treats the
          # `ambiguous call of overridden BIF abs/1` diagnostic in the codegen
          # `if_with_else_branch` fixture as a compile *error*; OTP 28 treats
          # it as a warning, which is what the runtime expects (erlc must exit
          # 0 for the test framework's snapshot RUN LOG capture to fire).
          otp-version: ${{ steps.otp.outputs.release }}

      # Decisions 227 and 228: the compiler's release; any other release here
      # fails the job rather than testing against it.
      - name: Assert Erlang/OTP
        shell: bash
        env:
          OTP: ${{ steps.otp.outputs.release }}
        run: |
          otp="$(erl -noshell -eval 'io:format("~s",[erlang:system_info(otp_release)]),halt().')"
          [ "$otp" = "$OTP" ] || { echo "Erlang/OTP is '$otp', not $OTP (decisions 227, 228)"; exit 1; }

      # 26 wasm-codegen snapshot tests embed the wasmtime `RUN LOG`
      # (stdout of the generated `.wat` evaluated against wasmtime) into
      # the snapshot itself. Without wasmtime on PATH the run log is
      # empty and every wasm snapshot mismatches.
      #
      # We pin a specific release tarball instead of running the
      # `wasmtime.dev/install.sh` shell installer — that script's
      # version lookup is flaky on the GH runners (resolves to
      # `<!DOCTYPE html>` when the upstream release feed 404s under
      # rate-limiting).
      - name: Install wasmtime
        shell: bash
        env:
          WASMTIME_VERSION: v45.0.1
        run: |
          set -euo pipefail
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/wasmtime.tar.xz "$url"
          mkdir -p "$HOME/.wasmtime/bin"
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp/
          mv "/tmp/wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$HOME/.wasmtime/bin/"
          chmod +x "$HOME/.wasmtime/bin/wasmtime"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          "$HOME/.wasmtime/bin/wasmtime" --version

      # First step prints the resolved Zig version + SHA so a CI red can be
      # bisected against a Zig point release without re-running the job.
      - name: Print build identity
        shell: bash
        run: |
          echo "zig version: $(zig version)"
          echo "git sha: $GITHUB_SHA"
          echo "runner: ${{ matrix.runner }}"

      # Node 22, the floor std's commonJS bodies need: `fs.glob` matches a
      # segment with `fs.globSync` (Node 22+, libs/std/src/io/fs.bp); under
      # Node 20 it throws, the walk answers `[]` and std's glob tests fail.
      - name: Install Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The libraries the gate's test-libs stage compiles and tests:
      # `botopink-lib-test` discovers `<root>/libs` (std) and every project
      # under `<root>/repository/`, and `botopink` resolves a library's own
      # dependencies through the same roots. Decision 326: the shared
      # libraries are repositories of their own, not bundled with the compiler.
      # Every library of the meta repository's `repository/` is checked out: a
      # library missing here fails the cells that depend on it (`styled`, `snap`).
      - name: Checkout emilia
        uses: actions/checkout@v5
        with: { repository: botopink/emilia, ref: feat, path: repository/emilia }
      - name: Checkout erika
        uses: actions/checkout@v5
        with: { repository: botopink/erika, ref: feat, path: repository/erika }
      - name: Checkout jhonstart
        uses: actions/checkout@v5
        with: { repository: botopink/jhonstart, ref: feat, path: repository/jhonstart }
      - name: Checkout onze
        uses: actions/checkout@v5
        with: { repository: botopink/onze, ref: feat, path: repository/onze }
      - name: Checkout rakun
        uses: actions/checkout@v5
        with: { repository: botopink/rakun, ref: feat, path: repository/rakun }
      - name: Checkout actions
        uses: actions/checkout@v5
        with: { repository: botopink/actions, ref: feat, path: repository/actions }
      - name: Checkout http
        uses: actions/checkout@v5
        with: { repository: botopink/http, ref: feat, path: repository/http }
      - name: Checkout log
        uses: actions/checkout@v5
        with: { repository: botopink/log, ref: feat, path: repository/log }
      - name: Checkout routing
        uses: actions/checkout@v5
        with: { repository: botopink/routing, ref: feat, path: repository/routing }
      - name: Checkout validation
        uses: actions/checkout@v5
        with: { repository: botopink/validation, ref: feat, path: repository/validation }
      - name: Checkout css
        uses: actions/checkout@v5
        with: { repository: botopink/css, ref: feat, path: repository/css }
      - name: Checkout styled
        uses: actions/checkout@v5
        with: { repository: botopink/styled, ref: feat, path: repository/styled }
      - name: Checkout snap
        uses: actions/checkout@v5
        with: { repository: botopink/snap, ref: feat, path: repository/snap }
      - name: Checkout json
        uses: actions/checkout@v5
        with: { repository: botopink/json, ref: feat, path: repository/json }
      - name: Checkout yaml
        uses: actions/checkout@v5
        with: { repository: botopink/yaml, ref: feat, path: repository/yaml }
      - name: Checkout markdown
        uses: actions/checkout@v5
        with: { repository: botopink/markdown, ref: feat, path: repository/markdown }
      - name: Checkout dbcontext
        uses: actions/checkout@v5
        with: { repository: botopink/dbcontext, ref: feat, path: repository/dbcontext }

      - name: Print library identity
        shell: bash
        run: |
          for r in repository/*/; do
            echo "$(basename "$r"): $(git -C "$r" rev-parse HEAD)"
          done

      # The gate, with conformance (decision 477) and cold: the run that
      # decides a merge reads no cache (`scripts/gate.sh` § warm and cold).
      - name: scripts/gate.sh --cold
        shell: bash
        run: bash scripts/gate.sh --cold
