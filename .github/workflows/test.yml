# Push/PR CI for botopink-lang — `scripts/gate.sh`, the repository's one gate
# (decisions 466, 470, 477, 987): the same stages the commit hook runs with
# `--no-conformance`, here WITH conformance and `--cold`, so a push to `feat`
# runs every stage the gate declares. The workflow keeps no list of stages of
# its own: the rows and their order are `scripts/gate.sh --list-rows` — a stage,
# or a stage split by target once per target (decision 1004 (2)) —, a row runs as
# `scripts/gate.sh --cold --stage <name> [--target <t>]`, and a stage or a target
# is added to or removed from `scripts/gate.sh`, never here. A front's
# Conformance step reads this run (decision 477): one verdict per commit, the
# `scripts/gate.sh` job.
#
# The jobs, each on its own ubuntu-22.04 runner (no macos row; no windows row —
# 1.0.11-beta 00-gate, gate-f: the snapshot capture carries CRLF / path-separator
# drift there, and a row that cannot fail measures nothing), so a run's wall time
# is its longest job rather than the sum of the stages:
#
#   stages     reads the rows from `scripts/gate.sh --list-rows` (and
#              `--uses-binaries`) and hands them to the jobs below as matrices:
#              a row is `<stage>`, or `<stage> <target>` for a stage split by
#              target (test-conformance: commonJS, erlang, beam, wasm).
#   build      the `build` stage (`zig build`, ReleaseSafe — the mode the gate
#              builds) once; uploads `zig-out/` as an artifact.
#   unit       one job per stage that reads sources only (zig fmt, the OTP
#              release, the backend partition audit, `zig build test`,
#              `test-bpmp`, the beam export audit, `test-web`); starts at once.
#   installed  one job per row that runs the installed binaries and reads no
#              `.bpr` set (`test-cli`, `test-docs`); downloads `build`'s artifact
#              and runs with `--prebuilt`, so nothing compiles the compiler again.
#   sets       the `conformance-sets` stage once (decisions 1006 (6) P4, 1077):
#              every `.bpr` set the rows test — a bare `botopink build` in each
#              member of `conformance/modules/` and of each library's program —
#              with `build`'s binaries; uploads `modules/.botopinkbuild/runtime/`
#              and `libraries/.sets/` as one artifact that lives this run only, the
#              sets that did build even when one did not (the job is then red).
#              The sets hold no absolute path (decisions 1030 (3), 1078), so they
#              run on another runner's checkout.
#   conformance one job per row that reads those sets (`gate.sh --list-rows
#              --uses-sets`: `test-conformance` once per target, `--target <t>`,
#              each row its own verdict); downloads `build`'s and `sets`'
#              artifacts and runs with `--prebuilt --prebuilt-sets`: the row only
#              runs `run --target <t>`, no comptime; a member whose handed set it
#              built again is a red (`prebuilt sets: N reused, M built again`), and
#              one with no set is `FAIL <m> — set not built` while the others run.
#              The rows run even when `sets` is red; an expired artifact fails the
#              download naming it (a row is never re-run alone: re-run the workflow).
#   pack       `wasm_pack_runs_standalone` (`modules/compiler-cli/tests/wasm_pack.sh`,
#              decisions 1036, 1079 (2)) with `build`'s binaries: the one job given
#              the pinned wasmtime CLI (ci-setup's `wasmtime-cli` input), so the packed
#              component is run by a standalone `wasmtime run`; a failed download
#              is this job's red alone. Elsewhere the script skips that half, named.
#   gate       the run's one verdict: red when any job above is (a matrix job
#              is red when any of its rows is).
#
# Every job has a `timeout-minutes` (decision 1004 (2)): a hung test ends its
# job, never runs to GitHub's six hours. The bounds are about twice the
# longest green run of each job.
#
# Every stage job runs its stage cold (`--cold`, decisions 509 (5), 754): the run
# that decides a merge reads no botopink cache. Only Zig's own compile cache and
# the toolchain downloads are cached (`.github/actions/ci-setup`), never anything
# under `.botopinkbuild/` (decision 225). The toolchain — zig, the compiler's
# Erlang/OTP release (decisions 227, 228), node 22 and the sibling
# libraries the conformance stage tests (decision 996, `conformance/AGENTS.md`) —
# is `.github/actions/ci-setup`'s, one text for every job.

name: test

# Pushes only: the project lands by pushing to feat and never works through a pull request, and an open
# feat → main pull request made every feat commit run twice (push + pull_request).
on:
  push:
    branches: [main, feat]
    # A push changing only the generated ledger (the maintainer's commit after each decision) runs nothing; a push
    # touching any other file runs every row (the maintainer, 2026-10-27). The meta's hook-integrity.yml still
    # checks the ledger on the pointer bump (check 6).
    paths-ignore: [decisions-taken.md]

# Every commit pushed to feat runs to the end (decision 528): with two machines pushing, one group per ref left
# no run finished; a group per commit queues past the concurrent-job limit and cancels none.
concurrency:
  # decision 528: a push to feat runs in a group of its own commit, so every commit has its verdict
  group: test-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  stages:
    name: stage list (scripts/gate.sh --list-rows)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.lists.outputs.unit }}
      installed: ${{ steps.lists.outputs.installed }}
      conformance: ${{ steps.lists.outputs.conformance }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Read the rows from scripts/gate.sh
        id: lists
        shell: bash
        run: |
          all="$(bash scripts/gate.sh --list-rows)"
          bins="$(bash scripts/gate.sh --list-rows --uses-binaries)"
          sets="$(bash scripts/gate.sh --list-rows --uses-sets)"
          # each row `<stage>` or `<stage> <target>` → {"stage": …, "target": …} (target "" when whole)
          json() { jq -Rsc 'split("\n") | map(select(. != "") | split(" ") | {stage: .[0], target: (.[1] // "")})'; }
          # every row but `build` (its own job) and the ones that run the installed binaries
          unit="$(printf '%s\n' "$all" | grep -vxF build | grep -vxFf <(printf '%s\n' "$bins") | json)"
          # the rows that run the installed binaries, but `conformance-sets` (the `sets` job) and the rows
          # that read its sets (the `conformance` job)
          installed="$(printf '%s\n' "$bins" | grep -vxF conformance-sets | grep -vxFf <(printf '%s\n' "$sets") | json)"
          conformance="$(printf '%s\n' "$sets" | json)"
          echo "unit=$unit" >> "$GITHUB_OUTPUT"
          echo "installed=$installed" >> "$GITHUB_OUTPUT"
          echo "conformance=$conformance" >> "$GITHUB_OUTPUT"
          echo "unit: $unit"
          echo "installed: $installed"
          echo "conformance: $conformance"

  build:
    name: build (scripts/gate.sh --stage build)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: ./.github/actions/ci-setup
        with:
          zig-cache: 'true'
          zig-cache-name: build
      - name: scripts/gate.sh --cold --portable --stage build
        shell: bash
        run: bash scripts/gate.sh --cold --portable --stage build
      # tar keeps the executable bits an artifact upload drops.
      - name: Pack the binaries
        shell: bash
        run: tar -czf zig-out.tgz zig-out
      - uses: actions/upload-artifact@v4
        with:
          name: zig-out
          path: zig-out.tgz
          retention-days: 1
          if-no-files-found: error

  unit:
    name: ${{ matrix.row.stage }}
    needs: stages
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.stages.outputs.unit) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: ./.github/actions/ci-setup
        with:
          libs: 'true'
          zig-cache: 'true'
          zig-cache-name: ${{ matrix.row.stage }}
      - name: scripts/gate.sh --cold --test-shards 8 --stage ${{ matrix.row.stage }}
        shell: bash
        env:
          STAGE: ${{ matrix.row.stage }}
          TARGET: ${{ matrix.row.target }}
        # 4-CPU runners; the suite mostly waits on node / erl / wasmtime, so 8 shards (gate.sh --test-shards)
        run: bash scripts/gate.sh --cold --test-shards 8 --stage "$STAGE" ${TARGET:+--target "$TARGET"}

  installed:
    name: ${{ matrix.row.target && format('{0} ({1})', matrix.row.stage, matrix.row.target) || matrix.row.stage }}
    needs: [stages, build]
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.stages.outputs.installed) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: ./.github/actions/ci-setup
        with:
          libs: 'true'
          zig-cache: 'true'
          zig-cache-name: ${{ matrix.row.stage }}${{ matrix.row.target && format('-{0}', matrix.row.target) || '' }}
      - uses: actions/download-artifact@v4
        with:
          name: zig-out
      - name: Unpack the binaries
        shell: bash
        run: tar -xzf zig-out.tgz
      - name: scripts/gate.sh --cold --portable --prebuilt --stage ${{ matrix.row.stage }} ${{ matrix.row.target && format('--target {0}', matrix.row.target) || '' }}
        shell: bash
        env:
          STAGE: ${{ matrix.row.stage }}
          TARGET: ${{ matrix.row.target }}
        run: bash scripts/gate.sh --cold --portable --prebuilt --stage "$STAGE" ${TARGET:+--target "$TARGET"}

  # Decision 1006 (6) P4: the root package's `.bpr` sets, built once with `build`'s binaries and handed to
  # every `conformance` row. The artifact lives for this run only (no botopink cache across runs, decision 225).
  sets:
    name: conformance-sets (scripts/gate.sh --stage conformance-sets)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: ./.github/actions/ci-setup
        with:
          zig-cache: 'true'
          zig-cache-name: conformance-sets
      - uses: actions/download-artifact@v4
        with:
          name: zig-out
      - name: Unpack the binaries
        shell: bash
        run: tar -xzf zig-out.tgz
      - name: scripts/gate.sh --cold --portable --prebuilt --stage conformance-sets
        shell: bash
        run: bash scripts/gate.sh --cold --portable --prebuilt --stage conformance-sets
      # Decision 1077 (4): the sets that did build are handed on even when one did not.
      - name: Pack the sets
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p conformance/modules/.botopinkbuild/runtime conformance/libraries/.sets
          tar -czf conformance-sets.tgz -C conformance modules/.botopinkbuild/runtime libraries/.sets
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: conformance-sets
          path: conformance-sets.tgz
          retention-days: 1
          if-no-files-found: error

  conformance:
    name: ${{ matrix.row.target && format('{0} ({1})', matrix.row.stage, matrix.row.target) || matrix.row.stage }}
    needs: [stages, build, sets]
    # The rows run when `sets` is red (a member that did not build is their `set not built` red).
    if: ${{ !cancelled() && needs.stages.result == 'success' && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.stages.outputs.conformance) }}
    runs-on: ubuntu-22.04
    # test-conformance took 25–31 min whole before the split by target; the libraries joined it (decision 996)
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: ./.github/actions/ci-setup
        with:
          libs: 'true'
          zig-cache: 'true'
          zig-cache-name: ${{ matrix.row.stage }}${{ matrix.row.target && format('-{0}', matrix.row.target) || '' }}
      - uses: actions/download-artifact@v4
        with:
          name: zig-out
      - uses: actions/download-artifact@v4
        with:
          name: conformance-sets
      - name: Unpack the binaries and the sets
        shell: bash
        run: |
          tar -xzf zig-out.tgz
          tar -xzf conformance-sets.tgz -C conformance
      - name: scripts/gate.sh --cold --portable --prebuilt --prebuilt-sets --stage ${{ matrix.row.stage }} ${{ matrix.row.target && format('--target {0}', matrix.row.target) || '' }}
        shell: bash
        env:
          STAGE: ${{ matrix.row.stage }}
          TARGET: ${{ matrix.row.target }}
        run: bash scripts/gate.sh --cold --portable --prebuilt --prebuilt-sets --stage "$STAGE" ${TARGET:+--target "$TARGET"}

  # Decisions 1036, 1079 (2): the one job with the wasmtime CLI, for `wasm_pack_runs_standalone`.
  pack:
    name: wasm_pack_runs_standalone (tests/wasm_pack.sh)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: ./.github/actions/ci-setup
        with:
          wasmtime-cli: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: zig-out
      - name: Unpack the binaries
        shell: bash
        run: tar -xzf zig-out.tgz
      # The cell's wasmtime half must run here, never skip.
      - name: The wasmtime CLI is on PATH
        shell: bash
        run: wasmtime --version
      - name: modules/compiler-cli/tests/wasm_pack.sh
        shell: bash
        run: BOTOPINK_BIN="$PWD/zig-out/bin/botopink" bash modules/compiler-cli/tests/wasm_pack.sh

  # The run's one verdict, for a front's Conformance step (decision 477).
  gate:
    name: scripts/gate.sh
    if: always()
    needs: [stages, build, unit, installed, sets, conformance, pack]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Every job green
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "a job of the gate is $r"; exit 1; }; done
