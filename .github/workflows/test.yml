# Push/PR CI for botopink-lang — `scripts/gate.sh`, the repository's one gate
# (decisions 466, 470, 477, 987): the same stages the commit hook runs with
# `--no-conformance`, here WITH conformance and `--cold`, so a push to `feat`
# runs every stage the gate declares. The workflow keeps no list of stages of
# its own: the stages and their order are `scripts/gate.sh --list-stages`, a
# stage runs as `scripts/gate.sh --cold --stage <name>`, and a stage is added to
# or removed from `scripts/gate.sh`, never here. A front's Conformance step reads
# this run (decision 477): one verdict per commit, the `scripts/gate.sh` job.
#
# The jobs, each on its own ubuntu-22.04 runner (no macos row; no windows row —
# 1.0.11-beta 00-gate, gate-f: the snapshot capture carries CRLF / path-separator
# drift there, and a row that cannot fail measures nothing), so a run's wall time
# is its longest job rather than the sum of the stages:
#
#   stages     reads the stage list from `scripts/gate.sh --list-stages` (and
#              `--uses-binaries`) and hands it to the jobs below as matrices.
#   build      the `build` stage (`zig build`, ReleaseSafe — the mode the gate
#              builds) once; uploads `zig-out/` as an artifact.
#   unit       one job per stage that reads sources only (zig fmt, the OTP
#              release, the backend partition audit, `zig build test`,
#              `test-bpmp`, the beam export audit, `test-web`); starts at once.
#   installed  one job per stage that runs the installed binaries (`test-cli`,
#              `test-libs`, `test-conformance`, `test-docs`, `tsc-check`); downloads
#              `build`'s artifact and runs with `--prebuilt`, so nothing compiles
#              the compiler again.
#   gate       the run's one verdict: red when any job above is.
#
# Every stage job runs its stage cold (`--cold`, decisions 509 (5), 754): the run
# that decides a merge reads no botopink cache. Only Zig's own compile cache and
# the toolchain downloads are cached (`.github/actions/ci-setup`), never anything
# under `.botopinkbuild/` (decision 225). The toolchain — zig, the compiler's
# Erlang/OTP release (decisions 227, 228), wasmtime, node 22 and the sibling
# libraries test-libs compiles and tests (`scripts/AGENTS.md` § test-libs.sh) —
# is `.github/actions/ci-setup`'s, one text for every job.

name: test

on:
  push:
    branches: [main, feat]
  pull_request:
    branches: [main, feat]

# Every commit pushed to feat runs to the end (decision 528): with two machines pushing, one group per ref left
# no run finished; a group per commit queues past the concurrent-job limit and cancels none.
concurrency:
  # decision 528: a push to feat runs in a group of its own commit, so every commit has its verdict;
  # a pull request keeps one group and cancels its older runs
  group: test-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  stages:
    name: stage list (scripts/gate.sh --list-stages)
    runs-on: ubuntu-22.04
    outputs:
      unit: ${{ steps.lists.outputs.unit }}
      installed: ${{ steps.lists.outputs.installed }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Read the stage lists from scripts/gate.sh
        id: lists
        shell: bash
        run: |
          all="$(bash scripts/gate.sh --list-stages)"
          bins="$(bash scripts/gate.sh --list-stages --uses-binaries)"
          json() { jq -Rsc 'split("\n") | map(select(. != ""))'; }
          # every stage but `build` (its own job) and the ones that run the installed binaries
          unit="$(printf '%s\n' "$all" | grep -vxF build | grep -vxFf <(printf '%s\n' "$bins") | json)"
          installed="$(printf '%s\n' "$bins" | json)"
          echo "unit=$unit" >> "$GITHUB_OUTPUT"
          echo "installed=$installed" >> "$GITHUB_OUTPUT"
          echo "unit: $unit"
          echo "installed: $installed"

  build:
    name: build (scripts/gate.sh --stage build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: ./.github/actions/ci-setup
        with:
          zig-cache: 'true'
      - name: scripts/gate.sh --cold --stage build
        shell: bash
        run: bash scripts/gate.sh --cold --stage build
      # tar keeps the executable bits an artifact upload drops.
      - name: Pack the binaries
        shell: bash
        run: tar -czf zig-out.tgz zig-out
      - uses: actions/upload-artifact@v4
        with:
          name: zig-out
          path: zig-out.tgz
          retention-days: 1
          if-no-files-found: error

  unit:
    name: ${{ matrix.stage }}
    needs: stages
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(needs.stages.outputs.unit) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: ./.github/actions/ci-setup
        with:
          libs: 'true'
          zig-cache: 'true'
      - name: scripts/gate.sh --cold --stage ${{ matrix.stage }}
        shell: bash
        run: bash scripts/gate.sh --cold --stage "${{ matrix.stage }}"

  installed:
    name: ${{ matrix.stage }}
    needs: [stages, build]
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(needs.stages.outputs.installed) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: ./.github/actions/ci-setup
        with:
          libs: 'true'
          zig-cache: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: zig-out
      - name: Unpack the binaries
        shell: bash
        run: tar -xzf zig-out.tgz
      - name: scripts/gate.sh --cold --prebuilt --stage ${{ matrix.stage }}
        shell: bash
        run: bash scripts/gate.sh --cold --prebuilt --stage "${{ matrix.stage }}"

  # The run's one verdict, for a front's Conformance step (decision 477).
  gate:
    name: scripts/gate.sh
    if: always()
    needs: [stages, build, unit, installed]
    runs-on: ubuntu-22.04
    steps:
      - name: Every job green
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "a job of the gate is $r"; exit 1; }; done
